services:
  postgres:
    image: postgres:16
    container_name: project13_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate_db
    ports:
      - "5437:5432"
    volumes:
      - project13_postgres_data:/var/lib/postgresql/data

volumes:
  project13_postgres_data: